name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Verify data layer
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import app.db as db

          with tempfile.TemporaryDirectory() as tmp:
              db.DB_PATH = Path(tmp) / "test.db"
              db.init_db()
              count = db.replace_members([
                  {"id_number": " 9001015009087 ", "full_name": "Test Member"},
                  {"id_number": "TEST-002", "full_name": "Second Member"},
              ])
              assert count == 2
              assert db.member_count() == 2
              assert db.lookup_member("9001015009087")["full_name"] == "Test Member"
              assert db.lookup_member("test 002")["full_name"] == "Second Member"
              db.log_checkin("9001015009087", "Test Member", "granted")
              assert len(db.recent_checkins()) == 1

          print("Data layer validation passed")
          PY

      # PySide6 is a desktop GUI dependency. The application itself is not
      # launched in CI because GitHub-hosted Linux runners are headless.
      - name: Validate desktop source without launching GUI
        run: python -m compileall -q app/main.py app/excel_import.py
